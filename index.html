<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101820" />
    <title>Pixel Outbreak Survivor</title>
  </head>
  <body>
    <main class="shell">
      <section class="game-card" aria-label="Pixel Outbreak Survivor game">
        <div class="canvas-frame">
          <canvas id="game" width="960" height="540" aria-label="Game canvas"></canvas>
          <div id="hud" class="hud"></div>
          <div id="overlay" class="overlay"></div>
        </div>
        <aside class="control-panel" aria-label="Controls">
          <div>
            <p class="panel-kicker">Controls</p>
            <div class="key-grid">
              <span>WASD</span><p>Move</p>
              <span>Mouse</span><p>Aim</p>
              <span>Click</span><p>Shoot</p>
              <span>Touch</span><p>Twin-stick move, aim, and shoot</p>
              <span>P</span><p>Pause</p>
            </div>
          </div>
          <div>
            <p class="panel-kicker">Objective</p>
            <p class="panel-copy">Survive waves, collect upgrades, and keep rival survivors from pinning you down.</p>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
